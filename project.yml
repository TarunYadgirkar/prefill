name: Prefill
options:
  bundleIdPrefix: com.tarunyadgirkar
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
configs:
  Personal: debug
  AppStore: release
configFiles:
  Personal: Config/Personal.xcconfig
  AppStore: Config/AppStore.xcconfig
packages:
  PrefillKit:
    path: Packages/PrefillKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Manual
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "PROVISIONING_PROFILE_SPECIFIER[sdk=iphonesimulator*]": ""
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PREFILL_KEYCHAIN_GROUP: $(AppIdentifierPrefix)com.tarunyadgirkar.prefill.shared
    PREFILL_APP_GROUP: group.com.tarunyadgirkar.prefill
    NS_CONTACTS_USAGE: Prefill reads and reorders the emails, phone numbers and addresses on your own contact card, so Safari suggests the right ones on each site.
  configs:
    # The simulator hands out a group container even without the entitlement, so the
    # free-team build leaves the name empty and StoreFactory falls back to the Keychain.
    Personal:
      PREFILL_APP_GROUP: ""
settingGroups:
  # Signed by hand with the free team's Apple Development certificate: no provisioning
  # profile is needed for a Mac app without restricted entitlements, and the stable
  # signature keeps the Contacts grant across rebuilds.
  macSigning:
    DEVELOPMENT_TEAM: 5AKJYZ7USP
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    # Without this, a debug signature lets any process of the same user attach to Prefill
    # and read Contacts through it.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    TARGETED_DEVICE_FAMILY: ""
  sharedContainer:
    configs:
      Personal:
        CODE_SIGN_ENTITLEMENTS: Config/Personal.entitlements
      AppStore:
        CODE_SIGN_ENTITLEMENTS: Config/AppStore.entitlements
targets:
  Prefill:
    type: application
    platform: iOS
    sources: [App]
    settings:
      groups: [sharedContainer]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PREFILL_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Prefill
        INFOPLIST_KEY_NSContactsUsageDescription: $(NS_CONTACTS_USAGE)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    dependencies:
      - package: PrefillKit
      - target: PrefillSafari
        embed: true
  PrefillSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Extension/Resources/manifest.json
        buildPhase: resources
      - path: Extension/Resources/content.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/background.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/popup.html
        buildPhase: resources
        optional: true
      - path: Extension/Resources/popup.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/popup.css
        buildPhase: resources
        optional: true
      - path: Extension/Resources/_locales
        type: folder
        buildPhase: resources
      - path: Extension/Resources/images
        type: folder
        buildPhase: resources
    settings:
      groups: [sharedContainer]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PREFILL_BUNDLE_ID).safari
        INFOPLIST_FILE: Extension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Prefill
        INFOPLIST_KEY_NSContactsUsageDescription: $(NS_CONTACTS_USAGE)
    dependencies:
      - package: PrefillKit
  PrefillMac:
    type: application
    platform: macOS
    sources:
      - MacApp
      - MacShared
      - path: App/AppIcon.icon
    settings:
      groups: [macSigning]
      base:
        PRODUCT_NAME: Prefill
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.mac
        CODE_SIGN_ENTITLEMENTS: MacApp/Prefill.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Prefill
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSContactsUsageDescription: Prefill reads your own contact card to suggest its emails, phone numbers and addresses in Chrome and Arc, and adds new ones you type there.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: PrefillKit
      - target: PrefillHost
        embed: true
        codeSign: true
        copy:
          destination: executables
    postCompileScripts:
      - name: Copy the Chrome extension
        basedOnDependencyAnalysis: false
        script: |
          src="$SRCROOT/web/dist-chrome"
          dst="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ChromeExtension"
          if [ ! -f "$src/manifest.json" ]; then echo "error: run pnpm --dir web build first"; exit 1; fi
          rm -rf "$dst" && mkdir -p "$dst" && cp -R "$src/" "$dst/"
  PrefillHost:
    type: tool
    platform: macOS
    sources:
      - MacHost
      - MacShared
    settings:
      groups: [macSigning]
      base:
        PRODUCT_NAME: prefill-host
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.mac.host
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: PrefillKit
  PrefillHostTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HostTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.hosttests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Prefill
  PrefillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.uitests
        TEST_TARGET_NAME: Prefill
    dependencies:
      - target: Prefill
schemes:
  Prefill:
    build:
      targets:
        Prefill: all
        PrefillUITests: [test]
    run:
      config: Personal
    test:
      config: Personal
      targets: [PrefillUITests]
    profile:
      config: AppStore
    analyze:
      config: Personal
    archive:
      config: AppStore
  PrefillMac:
    build:
      targets:
        PrefillMac: all
    run:
      config: Personal
    archive:
      config: Personal
  PrefillHostTests:
    build:
      targets:
        PrefillHostTests: [test]
    test:
      config: Personal
      targets: [PrefillHostTests]
