name: Prefill
options:
  bundleIdPrefix: com.tarunyadgirkar
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
configs:
  Personal: debug
  AppStore: release
configFiles:
  Personal: Config/Personal.xcconfig
  AppStore: Config/AppStore.xcconfig
packages:
  PrefillKit:
    path: Packages/PrefillKit
  # Self-updates for the Mac app downloaded as a DMG.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Manual
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "PROVISIONING_PROFILE_SPECIFIER[sdk=iphonesimulator*]": ""
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PREFILL_KEYCHAIN_GROUP: $(AppIdentifierPrefix)com.tarunyadgirkar.prefill.shared
    PREFILL_APP_GROUP: group.$(PREFILL_BUNDLE_ID)
    # The keyboard's own group: it holds only what the keyboard may read.
    PREFILL_KEYBOARD_GROUP: group.$(PREFILL_BUNDLE_ID).keyboard
    NS_CONTACTS_USAGE: Prefill reads and reorders the emails, phone numbers and addresses on your own contact card, so Safari suggests the right ones on each site.
settingGroups:
  # Xcode-managed profiles from the paid team (iCloud needs one), with the same Apple
  # Development certificate as before, so the stable signature keeps the Contacts grant
  # across rebuilds.
  macSigning:
    DEVELOPMENT_TEAM: 5AKJYZ7USP
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_HARDENED_RUNTIME: YES
    # Without this, a debug signature lets any process of the same user attach to Prefill
    # and read Contacts through it.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    TARGETED_DEVICE_FAMILY: ""
targets:
  Prefill:
    type: application
    platform: iOS
    sources: [App, KeyboardUI, AppCloud]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PREFILL_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PREFILL_CLOUD
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Prefill
        INFOPLIST_KEY_NSContactsUsageDescription: $(NS_CONTACTS_USAGE)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    dependencies:
      - package: PrefillKit
      - target: PrefillSafari
        embed: true
      - target: PrefillKeyboard
        embed: true
      - target: PrefillAutoFill
        embed: true
  PrefillSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Extension/Resources/manifest.json
        buildPhase: resources
      - path: Extension/Resources/content.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/background.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/popup.html
        buildPhase: resources
        optional: true
      - path: Extension/Resources/popup.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/popup.css
        buildPhase: resources
        optional: true
      - path: Extension/Resources/_locales
        type: folder
        buildPhase: resources
      - path: Extension/Resources/images
        type: folder
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/Extension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(PREFILL_BUNDLE_ID).safari
        INFOPLIST_FILE: Extension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Prefill
        INFOPLIST_KEY_NSContactsUsageDescription: $(NS_CONTACTS_USAGE)
    dependencies:
      - package: PrefillKit
  # The Prefill keyboard, for apps other than Safari. It joins only its own App Group, where the
  # app writes the values it shares.
  PrefillKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, KeyboardUI]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/Keyboard.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(PREFILL_BUNDLE_ID).keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Prefill
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    dependencies:
      - package: PrefillKit
  # Prefill in iOS's long-press AutoFill menu (text insertion only). It reads the keyboard's
  # snapshot from the keyboard's App Group and nothing else.
  PrefillAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - AutoFill
      - App/Theme/Palette.swift
      - KeyboardUI/KeyboardPalette.swift
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/AutoFill.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(PREFILL_BUNDLE_ID).autofill
        INFOPLIST_FILE: AutoFill/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Prefill
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    dependencies:
      - package: PrefillKit
  PrefillMac:
    type: application
    platform: macOS
    sources:
      - MacApp
      - MacShared
      - AppCloud
      - path: App/AppIcon.icon
    settings:
      groups: [macSigning]
      base:
        PRODUCT_NAME: Prefill
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.mac
        CODE_SIGN_ENTITLEMENTS: MacApp/Prefill.entitlements
        INFOPLIST_FILE: Config/MacInfo.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PREFILL_CLOUD
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Prefill
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSContactsUsageDescription: Prefill reads your own contact card to suggest its emails, phone numbers and addresses in Chrome and Arc, and adds new ones you type there.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Empty for builds from Xcode, so only a release (scripts/release-mac.sh) updates itself.
        PREFILL_FEED_URL: ""
    dependencies:
      - package: PrefillKit
      - package: Sparkle
      - target: PrefillHost
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: PrefillMacSafari
        embed: true
    postCompileScripts:
      - name: Copy the Chrome extension and the field rules
        basedOnDependencyAnalysis: false
        script: |
          src="$SRCROOT/web/dist-chrome"
          dst="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ChromeExtension"
          if [ ! -f "$src/manifest.json" ]; then echo "error: run pnpm --dir web build first"; exit 1; fi
          rm -rf "$dst" && mkdir -p "$dst" && cp -R "$src/" "$dst/"
          rules="$SRCROOT/web/dist-mac/autofill.js"
          if [ ! -f "$rules" ]; then echo "error: run pnpm --dir web build first"; exit 1; fi
          cp "$rules" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/autofill.js"
  # Safari's extension on the Mac: the same scripts as on iPhone, with a handler that asks the
  # running app over a socket in the shared group container instead of reading Contacts.
  PrefillMacSafari:
    type: app-extension
    platform: macOS
    sources:
      - MacSafari/SafariWebExtensionHandler.swift
      - MacShared
      - path: Extension/Resources/manifest.json
        buildPhase: resources
      - path: Extension/Resources/content.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/background.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/popup.html
        buildPhase: resources
        optional: true
      - path: Extension/Resources/popup.js
        buildPhase: resources
        optional: true
      - path: Extension/Resources/popup.css
        buildPhase: resources
        optional: true
      - path: Extension/Resources/_locales
        type: folder
        buildPhase: resources
      - path: Extension/Resources/images
        type: folder
        buildPhase: resources
    settings:
      groups: [macSigning]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.mac.safari
        CODE_SIGN_ENTITLEMENTS: MacSafari/PrefillSafari.entitlements
        INFOPLIST_FILE: MacSafari/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Prefill
    dependencies:
      - package: PrefillKit
  PrefillHost:
    type: tool
    platform: macOS
    sources:
      - MacHost
      - MacShared
    settings:
      groups: [macSigning]
      base:
        PRODUCT_NAME: prefill-host
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.mac.host
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: PrefillKit
  PrefillHostTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HostTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.hosttests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Prefill
  PrefillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.uitests
        TEST_TARGET_NAME: Prefill
    dependencies:
      - target: Prefill
schemes:
  Prefill:
    build:
      targets:
        Prefill: all
        PrefillUITests: [test]
    run:
      config: Personal
    test:
      config: Personal
      targets: [PrefillUITests]
    profile:
      config: AppStore
    analyze:
      config: Personal
    archive:
      config: AppStore
  PrefillMac:
    build:
      targets:
        PrefillMac: all
    run:
      config: Personal
    archive:
      config: Personal
  PrefillHostTests:
    build:
      targets:
        PrefillHostTests: [test]
    test:
      config: Personal
      targets: [PrefillHostTests]
