<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button form</title>
<style>body{font:17px system-ui;margin:16px} label{display:block;margin:10px 0} input{font:inherit;width:100%;padding:6px}</style></head>
<body>
<h1>Create account</h1>
<form action="thanks.html" method="get">
  <label>Full name <input name="fullname" autocomplete="name"></label>
  <label>Email <input type="email" name="email" autocomplete="email"></label>
  <label>Phone <input type="tel" name="phone" autocomplete="tel"></label>
  <label>Street address <input name="street" autocomplete="street-address"></label>
  <label>Password <input type="password" name="pw" autocomplete="current-password"></label>
  <label>Code <input name="otp" autocomplete="one-time-code" inputmode="numeric"></label>
  <button type="submit">Create account</button>
</form>
</body></html>
