<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Latency form</title>
<style>body{font:17px system-ui;margin:16px} label{display:block;margin:10px 0} input{font:inherit;width:100%;padding:6px}</style></head>
<body>
<h1>Save email</h1>
<form id="f">
  <label>Email <input type="email" name="email" autocomplete="email"></label>
  <button type="submit">Save</button>
  <button type="button" id="clear">Clear</button>
</form>
<script>
document.getElementById("f").addEventListener("submit", (e) => e.preventDefault());
document.getElementById("clear").addEventListener("click", () => { document.querySelector("input").value = ""; });
</script>
</body></html>
