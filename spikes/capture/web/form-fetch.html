<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fetch form</title>
<style>body{font:17px system-ui;margin:16px} label{display:block;margin:10px 0} input{font:inherit;width:100%;padding:6px}</style></head>
<body>
<h1>Join the waitlist</h1>
<div id="signup">
  <label>Email <input type="email" id="em" autocomplete="email"></label>
  <label>Phone <input type="tel" id="ph" autocomplete="tel"></label>
  <button type="button" id="go">Join waitlist</button>
</div>
<p id="status"></p>
<p><a href="away.html">Continue to the next page</a></p>
<script>
document.getElementById("go").addEventListener("click", async () => {
  const q = new URLSearchParams({ em: em.value, ph: ph.value });
  const r = await fetch("api.json?" + q);
  document.getElementById("signup").remove();
  document.getElementById("status").textContent = r.ok ? "You are on the list" : "Request failed " + r.status;
});
</script>
</body></html>
