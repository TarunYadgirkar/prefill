name: PrefillCapture
options:
  bundleIdPrefix: com.tarunyadgirkar.prefill.spike.capture
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CaptureApp:
    type: application
    platform: iOS
    sources: [App, Shared]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tarunyadgirkar.prefill.spike.capture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.spike.capture
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Prefill Capture
        INFOPLIST_KEY_NSContactsUsageDescription: Prefill adds values you confirm to your contact card.
    dependencies:
      - target: CaptureExtension
        embed: true
  CaptureExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Shared
      - path: Extension/Resources/manifest.json
        buildPhase: resources
      - path: Extension/Resources/background.js
        buildPhase: resources
      - path: Extension/Resources/content.js
        buildPhase: resources
      - path: Extension/Resources/_locales
        type: folder
        buildPhase: resources
      - path: Extension/Resources/images
        type: folder
        buildPhase: resources
    entitlements:
      path: Extension/Extension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tarunyadgirkar.prefill.spike.capture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.spike.capture.extension
        INFOPLIST_FILE: Extension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Prefill Capture Extension
        INFOPLIST_KEY_NSContactsUsageDescription: Prefill adds values you confirm to your contact card.
  CaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.spike.capture.uitests
        TEST_TARGET_NAME: CaptureApp
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: CaptureApp
schemes:
  PrefillCapture:
    build:
      targets:
        CaptureApp: all
        CaptureUITests: [test]
    test:
      targets: [CaptureUITests]
