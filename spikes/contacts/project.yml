name: ContactsProbe
options:
  bundleIdPrefix: com.tarunyadgirkar.prefill.spike.contacts
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
targets:
  Probe:
    type: application
    platform: iOS
    sources: [Probe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.spike.contacts.probe
        INFOPLIST_KEY_NSContactsUsageDescription: "Probe edits your My Info card to test Safari AutoFill."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ProbeUITests]
    dependencies:
      - target: Probe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.spike.contacts.uitests
        TEST_TARGET_NAME: Probe
schemes:
  Probe:
    build:
      targets:
        Probe: all
        ProbeUITests: [test]
    test:
      targets: [ProbeUITests]
