<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Save GET</title>
<style>body{font:17px -apple-system,system-ui;margin:0;padding:16px}form{display:grid;gap:150px}label{display:grid;gap:4px}input,button{font:inherit;padding:10px;border:1px solid #8884;border-radius:10px}</style></head>
<body><h1>Sign up (GET)</h1>
<form method="get" action="/thanks.html">
<label>Full name <input name="name" autocomplete="name" placeholder="Full name"></label>
<label>Email <input name="email" type="email" autocomplete="email" placeholder="Email"></label>
<label>Phone <input name="tel" type="tel" autocomplete="tel" placeholder="Phone"></label>
<button type="submit">Sign up</button>
</form></body></html>
