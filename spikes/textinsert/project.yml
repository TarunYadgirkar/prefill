name: TextInsertSpike
options:
  bundleIdPrefix: com.tarunyadgirkar.prefill.spike.textinsert
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5AKJYZ7USP
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TextInsertSpike:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: TextInsertProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.spike.textinsert
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Prefill Spike
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
  TextInsertProvider:
    type: app-extension
    platform: iOS
    sources: [Provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.spike.textinsert.provider
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Provider/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Prefill Spike
        CODE_SIGN_ENTITLEMENTS: Provider/Provider.entitlements
  TextInsertUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TextInsertSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.spike.textinsert.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TextInsertSpike
schemes:
  TextInsertSpike:
    build:
      targets:
        TextInsertSpike: all
        TextInsertUITests: [test]
    test:
      targets: [TextInsertUITests]
