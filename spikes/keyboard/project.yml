name: KeyboardSpike
options:
  bundleIdPrefix: com.tarunyadgirkar.prefill.spike.keyboard
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5AKJYZ7USP
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KeyboardSpike:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: KeyboardSpikeKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.spike.keyboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Prefill Keys
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSContactsUsageDescription: Prefill Keys reads your contact card to test offering your values in other apps.
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
  KeyboardSpikeKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.prefill.spike.keyboard.keys
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Keyboard/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Prefill Keys
        INFOPLIST_KEY_NSContactsUsageDescription: Prefill Keys reads your contact card to offer your values.
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
