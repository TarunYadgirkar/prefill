<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply for Software Engineer</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<!-- Mimics a Greenhouse job application: untagged text inputs, labels that end in a colon,
     and question answers named by index rather than by what they hold. -->
<h1>Apply for this job</h1>
<form id="application_form" action="thanks.html" method="post">
  <div class="field"><label for="first_name">First Name *</label><input type="text" id="first_name" name="job_application[first_name]"></div>
  <div class="field"><label for="last_name">Last Name *</label><input type="text" id="last_name" name="job_application[last_name]"></div>
  <div class="field"><label for="email">Email *</label><input type="text" id="email" name="job_application[email]"></div>
  <div class="field"><label for="question_0">GitHub/Portfolio:</label><input type="text" id="question_0" name="job_application[answers_attributes][0][text_value]"></div>
  <div class="field"><label for="question_1">LinkedIn:</label><input type="text" id="question_1" name="job_application[answers_attributes][1][text_value]"></div>
  <div class="field"><label for="question_2">How did you hear about this job?</label><input type="text" id="question_2" name="job_application[answers_attributes][2][text_value]"></div>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
