<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply for Software Engineering Intern</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<!-- A Greenhouse-style application with the parts one-tap fill handles: untagged text
     inputs, a state select, a yes/no radio group and the voluntary self-identification
     selects, with Greenhouse's and the OFCCP's own option texts. -->
<h1>Software Engineering Intern</h1>
<form id="application_form" action="thanks.html" method="post">
  <div class="field"><label for="first_name">First Name *</label><input type="text" id="first_name" name="job_application[first_name]"></div>
  <div class="field"><label for="last_name">Last Name *</label><input type="text" id="last_name" name="job_application[last_name]"></div>
  <div class="field"><label for="email">Email *</label><input type="text" id="email" name="job_application[email]"></div>
  <div class="field"><label for="phone">Phone</label><input type="text" id="phone" name="job_application[phone]"></div>
  <div class="field"><label for="question_1">LinkedIn Profile</label><input type="text" id="question_1" name="job_application[answers_attributes][1][text_value]"></div>
  <div class="field"><label for="question_0">GitHub/Portfolio:</label><input type="text" id="question_0" name="job_application[answers_attributes][0][text_value]"></div>
  <div class="field"><label for="school">School</label><input type="text" id="school" name="job_application[answers_attributes][3][text_value]"></div>
  <div class="field"><label for="state">State</label>
    <select id="state" name="job_application[state]"><option value="">Select...</option><option value="AZ">Arizona</option><option value="CA">California</option><option value="NY">New York</option></select></div>
  <fieldset class="field"><legend>Are you legally authorized to work in the United States?</legend>
    <label><input type="radio" name="job_application[authorized]" value="1"> Yes</label>
    <label><input type="radio" name="job_application[authorized]" value="0"> No</label></fieldset>
  <h2>Voluntary Self-Identification</h2>
  <div class="field"><label for="gender">Gender</label>
    <select id="gender" name="job_application[gender]"><option value="">Please select</option><option>Male</option><option>Female</option><option>Decline To Self Identify</option></select></div>
  <div class="field"><label for="hispanic">Are you Hispanic/Latino?</label>
    <select id="hispanic" name="job_application[hispanic_ethnicity]"><option value="">Please select</option><option>Yes</option><option>No</option><option>Decline To Self Identify</option></select></div>
  <div class="field"><label for="veteran">Veteran Status</label>
    <select id="veteran" name="job_application[veteran_status]"><option value="">Please select</option><option>I am not a protected veteran</option><option>I identify as one or more of the classifications of protected veteran</option><option>I don't wish to answer</option></select></div>
  <div class="field"><label for="disability">Disability Status</label>
    <select id="disability" name="job_application[disability_status]"><option value="">Please select</option><option>Yes, I have a disability (or previously had a disability)</option><option>No, I do not have a disability and have not had one in the past</option><option>I do not want to answer</option></select></div>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
