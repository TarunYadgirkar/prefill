Source: SmartRecruiters one-click apply (jobs.smartrecruiters.com/oneclick-ui), posting 70832055-56fb-4b0e-bcd5-a70360ecca4a
(Product Management AI-Tool Intern, Bosch Group)
Captured copy: github.com/fkabaalkhail/Applypilot chrome-extension/test/fixtures/real/smartrecruiters/sr-bosch-intern.html
SmartRecruiters draws its fields in Lit web components; the capture serialized their open shadow roots as
declarative <template shadowrootmode> (the test attaches them). The phone field's inner <input> was not
serialized in the capture, so the fixture has no phone box.
Fetched 2026-10-05. The ATS hosts are blocked by this session's egress policy, so the markup
comes from a saved copy of the live page committed to a public repository (path below),
fetched through raw.githubusercontent.com. Trimmed to the application form: scripts,
styles, SVGs, images, comments, classes, inline styles and reCAPTCHA removed; ids, names,
types, labels, aria-*, autocomplete, placeholders, options and fieldsets kept as captured.
Lists longer than 30 entries (universities, phone country pickers) keep their first entries.
-->
