<!-- Hand-written after a single-page app's sign-up screen: div wrappers, aria labels, a code box. -->
<div id="root">
  <form class="signup" novalidate>
    <div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" type="text"></div>
    <div class="field"><input id="signupEmail" name="email" type="email" autocomplete="email" aria-label="Email"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="new-password"></div>
    <div class="field"><label for="code">Verification code</label><input id="code" name="code" inputmode="numeric"></div>
    <div class="field" hidden><label for="hp">Leave this empty</label><input id="hp" name="website_email" type="email"></div>
    <label><input type="checkbox" name="newsletter"> Email me product news</label>
    <button id="create">Create account</button>
  </form>
</div>
